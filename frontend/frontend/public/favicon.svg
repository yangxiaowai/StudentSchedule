<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 书本图标 -->
  <rect x="18" y="20" width="16" height="20" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="30" y="20" width="16" height="20" rx="2" fill="#ffffff" opacity="0.7"/>
  
  <!-- 书本线条 -->
  <line x1="21" y1="26" x2="31" y2="26" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="30" x2="28" y2="30" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="34" x2="31" y2="34" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 时钟元素 -->
  <circle cx="42" cy="28" r="6" fill="#ffffff" stroke="#4F46E5" stroke-width="1.5"/>
  <line x1="42" y1="28" x2="42" y2="24" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="28" x2="45" y2="30" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 星星装饰 -->
  <polygon points="20,48 22,52 26,52 23,55 24,59 20,57 16,59 17,55 14,52 18,52" fill="#FFD700" opacity="0.8"/>
</svg>